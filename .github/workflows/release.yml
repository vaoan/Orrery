# Creates the GitHub Release when a release branch merges into main.
name: release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  create:
    name: create release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Version from the branch name
        id: version
        run: echo "version=${GITHUB_HEAD_REF#release/}" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::refusing to release: '$VERSION' is not vYYYY.MM.DD.N"
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "$VERSION" \
            --generate-notes
